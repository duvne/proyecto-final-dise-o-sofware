spring.application.name=volt-api-gateway
server.port=${SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.server.webflux.routes[0].id=usuarios-auth
spring.cloud.gateway.server.webflux.routes[0].uri=${USUARIOS_AUTH_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=catalogo-flota
spring.cloud.gateway.server.webflux.routes[1].uri=${CATALOGO_FLOTA_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/catalogo/**

spring.cloud.gateway.server.webflux.routes[2].id=reservas-pagos
spring.cloud.gateway.server.webflux.routes[2].uri=${RESERVAS_PAGOS_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/reservas/**,/api/pagos/**

spring.cloud.gateway.server.webflux.routes[3].id=operaciones-incidencias
spring.cloud.gateway.server.webflux.routes[3].uri=${OPERACIONES_INCIDENCIAS_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/operaciones/**,/api/incidencias/**

spring.cloud.gateway.server.webflux.routes[4].id=comunicacion
spring.cloud.gateway.server.webflux.routes[4].uri=${COMUNICACION_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/comunicacion/**
