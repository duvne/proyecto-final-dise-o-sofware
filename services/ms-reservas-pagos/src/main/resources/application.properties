spring.application.name=ms-reservas-pagos
server.port=${SERVER_PORT:8084}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/}
spring.mongodb.database=volt_reservas
spring.datasource.url=${RESERVAS_DB_URL:jdbc:postgresql://localhost:5432/volt_reservas}
spring.datasource.username=${RESERVAS_DB_USERNAME:volt}
spring.datasource.password=${RESERVAS_DB_PASSWORD:voltdev}
management.endpoints.web.exposure.include=health,info
